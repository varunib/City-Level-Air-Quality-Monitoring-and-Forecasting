<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050B14" />
    <meta name="description" content="City Air Quality Monitoring & Forecasting — Real-time AQI, pollutant tracking and 5-day forecasts" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>City Air Quality Monitoring &amp; Forecasting</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body {
        background: #050B14;
        color: #E2EAFF;
        font-family: 'Space Grotesk', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0a111f; }
      ::-webkit-scrollbar-thumb { background: #1a2840; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #243655; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
